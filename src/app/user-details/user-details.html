<mat-card class="details-card">

  <mat-card-header>
    <mat-card-title>User Details</mat-card-title>
    <mat-card-subtitle>Submitted registration information</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>

    <div class="detail-row">
      <strong>First Name:</strong>
      <span>{{ firstName }}</span>
    </div>

    <div class="detail-row">
      <strong>Last Name:</strong>
      <span>{{ lastName }}</span>
    </div>

    <div class="detail-row">
      <strong>Email:</strong>
      <span>{{ email }}</span>
    </div>

    <div class="detail-row">
      <strong>Phone Number:</strong>
      <span>{{ phoneNumber }}</span>
    </div>

  </mat-card-content>

</mat-card>
